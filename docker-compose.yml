services:
  postgres:
    image: postgres:16-alpine
    container_name: flashcards-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flashcards}
      POSTGRES_USER: ${POSTGRES_USER:-flashcards}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flashcards}
    # Nur an 127.0.0.1 binden - die Anwendung ist Single-User und lokal.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flashcards} -d ${POSTGRES_DB:-flashcards}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
