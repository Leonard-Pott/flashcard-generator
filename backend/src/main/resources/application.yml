spring:
  application:
    name: flashcard-generator

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:flashcards}
    username: ${POSTGRES_USER:flashcards}
    password: ${POSTGRES_PASSWORD:flashcards}

  jpa:
    open-in-view: false
    hibernate:
      # Schema-Hoheit liegt bei Flyway, Hibernate darf nichts anlegen oder aendern.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  # Single-User, kein Auth: nur lokal erreichbar.
  address: 127.0.0.1

app:
  cors:
    allowed-origins: http://localhost:4200

logging:
  level:
    de.leonard.flashcards: DEBUG
